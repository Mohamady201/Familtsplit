<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilySplit</title>
    <style>
        :root {
            --bg-color: #fdfcf8;
            --border-color: #1a1a1a;
            --baba-color: #2e7d32;
            --mama-color: #e91e63;
            --ahmed-color: #2196f3;
            --youssef-color: #ffb300;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .app-container { width: 100%; max-width: 400px; }

        .card {
            background: white;
            border: 3px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 0px var(--border-color);
            position: relative;
        }

        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid currentColor; font-weight: 800; font-size: 0.9rem;
            background: white; margin-right: 12px;
        }
        .BA { color: var(--baba-color); border-color: var(--baba-color); }
        .MA { color: var(--mama-color); border-color: var(--mama-color); }
        .AH { color: var(--ahmed-color); border-color: var(--ahmed-color); }
        .YO { color: var(--youssef-color); border-color: var(--youssef-color); }

        .btn-black {
            background: var(--border-color); color: white;
            border: none; border-radius: 12px; padding: 15px;
            font-weight: 900; cursor: pointer; width: 100%; font-size: 1rem;
        }

        .btn-x {
            position: absolute; top: 15px; right: 15px;
            background: #f0f0f0; border: 2px solid var(--border-color);
            border-radius: 50%; width: 32px; height: 32px;
            font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        input, select {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 3px solid var(--border-color); border-radius: 12px;
            box-sizing: border-box; font-size: 1rem; font-family: inherit;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .login-option {
            display: flex; align-items: center; padding: 12px;
            border: 3px solid var(--border-color); border-radius: 18px;
            margin-bottom: 12px; cursor: pointer; font-weight: 800;
        }

        .msg-box {
            padding: 10px; border-radius: 10px; font-weight: bold; 
            font-size: 0.8rem; margin-bottom: 15px; display: none;
            text-align: center;
        }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }

        label { font-weight: 800; font-size: 0.8rem; margin-left: 5px; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="screen-login" class="screen active">
        <h1 style="text-align:center; font-weight:900;">FamilySplit</h1>
        <div class="card">
            <h2 style="text-align:center; margin-top:0;">Who are you?</h2>
            <div class="login-option" onclick="toPass('Baba', 'BA', '1234')"><div class="avatar BA">BA</div> Baba</div>
            <div class="login-option" onclick="toPass('Mama', 'MA', '2222')"><div class="avatar MA">MA</div> Mama</div>
            <div class="login-option" onclick="toPass('Ahmed', 'AH', '1111')"><div class="avatar AH">AH</div> Ahmed</div>
            <div class="login-option" onclick="toPass('Youssef', 'YO', '0000')"><div class="avatar YO">YO</div> Youssef</div>
        </div>
    </div>

    <div id="screen-pin" class="screen">
        <div class="card">
            <button class="btn-x" onclick="showScreen('screen-login')">×</button>
            <h2 style="margin-top:0;">Enter PIN</h2>
            <div id="pin-msg" class="msg-box error">Incorrect PIN</div>
            <input type="password" id="pin-field" maxlength="4" style="text-align:center; font-size:2rem; letter-spacing:10px;">
            <button class="btn-black" onclick="checkPin()">Unlock</button>
        </div>
    </div>

    <div id="screen-dashboard" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="display:flex; align-items:center;">
                <div id="dash-avatar" class="avatar"></div>
                <strong><span id="dash-user-name"></span></strong>
            </div>
            <button class="btn-black" style="width:55px; font-size:1.5rem;" onclick="showScreen('screen-add')">+</button>
        </div>
        
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div id="balance-val" style="font-size:1.6rem; font-weight:900;">0.00 SAR</div>
                <div style="color:#888; font-size:0.8rem; text-align:right;">My Balance</div>
            </div>
        </div>

        <div id="dash-msg" class="msg-box success">History Cleared!</div>

        <h3>My Personal History</h3>
        <div id="history-list"></div>
        
        <div style="margin-top:40px;">
            <button onclick="logout()" style="width:100%; background:#eee; border:none; padding:12px; border-radius:12px; font-weight:bold; cursor:pointer;">Logout</button>
            <button onclick="clearMyHistory()" style="background:none; border:2px solid #ff1744; color:#ff1744; padding:10px; border-radius:12px; font-weight:bold; width:100%; cursor:pointer; margin-top:10px;">Clear My History Only</button>
        </div>
    </div>

    <div id="screen-add" class="screen">
        <div class="card">
            <button class="btn-x" onclick="showScreen('screen-dashboard')">×</button>
            <h2 style="margin-top:0;">New Entry</h2>
            
            <label>Description</label>
            <input type="text" id="add-desc" placeholder="Lunch, Games, etc.">
            
            <label>Amount (SAR)</label>
            <input type="number" id="add-amt" placeholder="0.00">
            
            <label>Date</label>
            <input type="date" id="add-date">
            
            <label>Send to:</label>
            <select id="add-target">
                <option value="No One">No One (Tracker Only)</option>
                <option value="Everyone">Everyone (Split 4 ways)</option>
                <option value="Baba">Baba</option>
                <option value="Mama">Mama</option>
                <option value="Ahmed">Ahmed</option>
                <option value="Youssef">Youssef</option>
            </select>
            <button class="btn-black" onclick="saveNewPayment()">Save & Track</button>
        </div>
    </div>

</div>

<script>
    let activeUser = {};
    let allPayments = JSON.parse(localStorage.getItem('family_payments')) || [];

    document.getElementById('add-date').valueAsDate = new Date();

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('pin-msg').style.display = 'none';
        document.getElementById('dash-msg').style.display = 'none';
    }

    function toPass(name, code, pin) {
        activeUser = { name, code, pin };
        document.getElementById('pin-field').value = '';
        showScreen('screen-pin');
    }

    function checkPin() {
        const pin = document.getElementById('pin-field').value;
        if(pin === activeUser.pin) {
            loadDashboard();
            showScreen('screen-dashboard');
        } else {
            const msg = document.getElementById('pin-msg');
            msg.style.display = 'block';
            msg.innerText = "❌ Incorrect PIN. Try again.";
        }
    }

    function loadDashboard() {
        document.getElementById('dash-user-name').innerText = activeUser.name;
        const av = document.getElementById('dash-avatar');
        av.innerText = activeUser.code;
        av.className = `avatar ${activeUser.code}`;
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        let balance = 0;

        allPayments.forEach(p => {
            const isMePayer = (p.by === activeUser.name);
            const isMeTarget = (p.target === activeUser.name || p.target === "Everyone");
            
            if ((p.target === "No One" && isMePayer) || (p.target !== "No One" && (isMePayer || isMeTarget))) {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.padding = '15px';
                
                let statusText = "";
                let share = 0;

                if (p.target === "No One") {
                    statusText = `<span style="color:#888">Private Tracker</span>`;
                } else if (isMePayer) {
                    const div = p.target === "Everyone" ? 4 : 2;
                    share = p.amt - (p.amt / div);
                    balance += share;
                    statusText = `<span style="color:var(--baba-color)">+${share.toFixed(2)} (Get back)</span>`;
                } else if (isMeTarget) {
                    const div = p.target === "Everyone" ? 4 : 2;
                    share = p.amt / div;
                    balance -= share;
                    statusText = `<span style="color:var(--mama-color)">-${share.toFixed(2)} (Owe)</span>`;
                }

                card.innerHTML = `<div style="display:flex; justify-content:space-between;"><strong>${p.desc}</strong><b>${p.amt}</b></div>
                                  <small style="color:#aaa">${p.date}</small><br>
                                  <div style="margin-top:5px; font-weight:bold">${statusText}</div>`;
                list.prepend(card);
            }
        });

        const balEl = document.getElementById('balance-val');
        balEl.innerText = `${balance.toFixed(2)} SAR`;
        balEl.style.color = balance >= 0 ? "var(--baba-color)" : "var(--mama-color)";
    }

    function saveNewPayment() {
        const desc = document.getElementById('add-desc').value;
        const amt = document.getElementById('add-amt').value;
        const date = document.getElementById('add-date').value;
        if(!desc || !amt) return;

        allPayments.push({ desc, amt: parseFloat(amt).toFixed(2), by: activeUser.name, target: document.getElementById('add-target').value, date });
        localStorage.setItem('family_payments', JSON.stringify(allPayments));
        
        document.getElementById('add-desc').value = '';
        document.getElementById('add-amt').value = '';
        renderHistory();
        showScreen('screen-dashboard');
    }

    function clearMyHistory() {
        // Only remove payments that YOU made. Others keep theirs.
        allPayments = allPayments.filter(p => p.by !== activeUser.name);
        localStorage.setItem('family_payments', JSON.stringify(allPayments));
        renderHistory();
        const msg = document.getElementById('dash-msg');
        msg.style.display = 'block';
        msg.innerText = "🧹 Your history has been cleared.";
    }

    function logout() { showScreen('screen-login'); }
</script>

</body>
</html>
